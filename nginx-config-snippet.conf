# nginx companion config for WP FastCGI Cache Purger
#
# Drop this into your server block (or an include). It sets up a FastCGI
# cache whose path must match the "FastCGI cache path" you enter in the
# plugin settings (Settings -> FastCGI Purger). Default below: /var/cache/nginx/fastcgi
#
# 1. Create the cache directory and let nginx write to it:
#      sudo mkdir -p /var/cache/nginx/fastcgi
#      sudo chown www-data:www-data /var/cache/nginx/fastcgi
#
# 2. Include this file (or paste it) inside the http { } block:
#      fastcgi_cache_path /var/cache/nginx/fastcgi levels=1:2 keys_zone=WORDPRESS:100m inactive=60m max_size=1g use_temp_path=off;
#      fastcgi_cache_key  "$scheme$request_method$host$request_uri";
#      fastcgi_ignore_headers Cache-Control Expires Set-Cookie;
#
# 3. And these rules inside your server { } block, typically around your php location:

# Serve the cache, but never for logged-in users, commenters, or dynamic endpoints.
set $skip_cache 0;

# POST requests and query strings go straight to PHP.
if ($request_method = POST)               { set $skip_cache 1; }
if ($query_string != "")                  { set $skip_cache 1; }

# Logged-in users and commenters bypass the cache.
if ($http_cookie ~* "comment_author|wordpress_[a-f0-9]+|wp-postpass|wordpress_no_cache|wordpress_logged_in") {
    set $skip_cache 1;
}

# Never cache these URIs.
if ($request_uri ~* "/wp-admin/|/wp-login.php|/xmlrpc.php|wp-.*.php|/feed/|index.php|sitemap(_index)?.xml|.*[0-9]{4}.*") {
    set $skip_cache 1;
}

location ~ \.php$ {
    include fastcgi_params;
    fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;

    # Enable the cache.
    fastcgi_cache_bypass  $skip_cache;
    fastcgi_no_cache      $skip_cache;
    fastcgi_cache         WORDPRESS;
    fastcgi_cache_valid   200 301 302 60m;
    fastcgi_cache_use_stale error timeout updating http_500 http_503;

    # Handy debug header: HIT / MISS / BYPASS / EXPIRED / STALE.
    add_header X-FastCGI-Cache $upstream_cache_status;
}
